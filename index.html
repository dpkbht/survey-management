V.wf=()=>H('Workflow','v1 is a configurable state machine: states, allowed transitions, who can act, and reasons. The visual canvas, parallel approvals and simulation come later.')+`<div class="c p-4 mb-4 flex flex-wrap items-center gap-2 text-sm">${S.slice(0,6).map(s=>chip(s[0])).join(' → ')}<span class="text-slate-500">then Closed, or back via correction and revisit</span></div><div class="grid lg:grid-cols-2 gap-4"><div>${T(['State','Reporting category'],S.map((s,i)=>TD([s[0],`<select onchange="S[${i}][1]=this.value;toast('Category updated')">${opt(Object.keys(CC),s[1])}</select>`])).join(''))}<div class="c p-3 mt-3 flex gap-2"><input id="ns" placeholder="New state, e.g. Awaiting RWA approval"><select id="nc" class="!w-44">${opt(Object.keys(CC))}</select><button class="b whitespace-nowrap" onclick="if(!$('#ns').value.trim())return toast('Name the state');S.push([$('#ns').value.trim(),$('#nc').value]);toast('State added to the draft');go('wf')">Add state</button></div></div>
${T(['From','Action','To','Who','Reason'],Object.entries(TR).flatMap(([f,a])=>a.map(x=>TD([f,x[0],x[1],who(x[0]),/Reject|correction|revisit|hold|Reopen/i.test(x[0])?'Required':'–']))).join(''))}</div>`;
const tg=(l,o)=>`<label class="flex justify-between py-1.5 text-sm"><span>${l}</span><input type="checkbox" ${o?'checked':''}></label>`,nm=(l,v,u)=>Lb(l+' ('+u+')',`<input type="number" value="${v}">`);
V.cfg=()=>H('Configuration','Set per client (tenant). Defaults below reflect how field work usually runs in India.')+`<div class="grid md:grid-cols-2 gap-4"><div class="c p-4"><h2 class="font-medium mb-2">Assignment</h2>${Lb('Mode','<select>'+opt(['Manual by dispatcher','Automatic','Hybrid'])+'</select>')}${tg('Engineer must accept before visit',0)}${tg('Engineer confirms visit slot with customer',1)}${tg('Reviewer cannot be the surveying engineer',1)}</div>
<div class="c p-4"><h2 class="font-medium mb-2">SLA (working time: Mon to Sat, 9:00 to 18:00 IST)</h2><div class="grid grid-cols-2 gap-2">${nm('Validate request',4,'hours')}${nm('Assign engineer',8,'hours')}${nm('Complete survey',3,'days')}${nm('Review report',24,'hours')}</div></div>
<div class="c p-4"><h2 class="font-medium mb-2">Data capture in the app</h2>${tg('GPS stamp at arrival and at submit',1)}${tg('Flag (not block) if more than 200 m from site',1)}${tg('Time and location stamp on every photo',1)}${tg('Customer sign-off (signature or OTP to customer mobile)',0)}${nm('Offline limit',7,'days')}${nm('Max photo size',1,'MB')}</div>
<div class="c p-4"><h2 class="font-medium mb-2">Business rules</h2>${nm('Survey valid for',90,'days')}${nm('Survey fee (₹, 0 = free; 18% GST added)',0,'₹')}${nm('Retain photos and reports',3,'years')}${tg('Store data in an Indian region',1)}</div></div>
<h2 class="font-medium mt-5 mb-2">Notifications</h2>${T(['Event','To','Push','WhatsApp','SMS','Email'],[['Engineer assigned','Engineer',1,0,0,0],['Visit scheduled','Customer',0,1,1,0],['Report returned','Engineer',1,0,0,1],['SLA warning','Dispatcher',1,0,0,1]].map(r=>TD(r.map((x,i)=>i<2?x:`<input type="checkbox" ${x?'checked':''}>`))).join(''))}
<p class="text-xs text-slate-500 mt-1">Customer SMS needs DLT-registered templates; WhatsApp needs customer opt-in.</p><div class="c p-4 mt-4"><h2 class="font-medium mb-2">Decisions made for India</h2><ul class="list-disc ml-5 text-sm space-y-1"><li>Dispatchers allocate, engineers confirm the slot; decline needs a reason. Strict accept/decline stays optional per client.</li><li>Offline: drafts plus queued uploads, up to 7 days. City GPS drifts, so distance from site is a flag for the reviewer, not a hard block.</li><li>Languages: English and Hindi first, then Marathi, Kannada, Tamil, Telugu, Bengali, Gujarati label packs.</li><li>Customer phone is masked in the app; calls go through the CMS. Consent is captured at request creation (DPDP Act 2023).</li><li>Public sites often have no CMS site record yet, so a request carries address and map pin, and the site is created on approval.</li></ul></div><button class="b mt-4" onclick="toast('Saved (mock)')">Save changes</button>`;
V.app=()=>H('Service App data','What the engineer sees, and everything the app sends back, so backend and mobile teams agree on the contract.')+`<div class="grid lg:grid-cols-3 gap-6"><div class="mx-auto w-64 border-8 border-slate-800 rounded-[2rem] bg-white p-3 text-xs h-fit"><div class="font-semibold text-sm">SR-1041: Home survey</div><div class="text-slate-500">Meera Nair, Indiranagar, Bengaluru 560038</div><div class="mt-2 bg-teal-50 rounded p-2">Visit: 19 Nov, 10:00 to 13:00<br>Confirm slot with customer: Done</div><div class="flex gap-2 mt-2"><span class="b !py-1">Navigate</span><span class="b o !py-1">Call (masked)</span></div><div class="mt-2 font-medium">Photos needed</div>${['Meter','MCB panel','Parking bay'].map(p=>`<div class="border-t py-1">${p}: 0 of 1</div>`).join('')}<div class="mt-2 font-medium">Form sections</div>Site, Power, Install, Outcome<div class="mt-3 bg-slate-100 rounded p-2">Can't complete? Customer not reachable, society denied entry, no meter access, unsafe site</div></div>
<div class="lg:col-span-2">${T(['Step','Data captured','Notes'],[['Sign in','User, device ID, app version','Short-lived token; remote logout'],['Inbox sync','Assignments since last sync cursor','Works offline after first sync'],['Accept or confirm slot','Decision, slot, decline reason','Per-client setting'],['Arrival','Latitude, longitude, accuracy, time','Flag if far from site'],['Form','Answers by field key, template version, renderer version','Drafts saved locally and on server'],['Photos','File, field key, time, GPS, hash','Compressed to about 1 MB, queued upload'],['Sign-off','Signature or customer OTP, consent','Optional per template'],['Visit outcome','Completed, or reason it could not be done','Reasons are configurable'],['Submit','Idempotency key, expected report version, offline flag','Server validates everything'],['Correction','Reviewer comments per field, new report version','Original is never overwritten']].map(TD).join(''))}</div></div>`;
go('dash');
</script></body></html>
